apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: web-deployment
  name: web-deployment
  namespace: webapp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web
  strategy: {}
  template:
    metadata:
      labels:
        app: web
    spec:

      shareProcessNamespace: true

      initContainers:
      - name: init-done
        image: busybox:1.36
        command: ["sh", "-c", "echo done"]
        # command: ["sh", "-c", "echo 'init failed'; exit 1"]


      containers:
      - image: nginx:1.27
        name: nginx
        ports:
        - containerPort: 80
        command:
        - /bin/sh
        - -c
        - |
          echo "<h1>hello in MLOPS MENA COMMUNITY : $(date '+%Y-%m-%d %H:%M:%S')</h1>" > /usr/share/nginx/html/index.html
          nginx -g 'daemon off;'

      
      - image: busybox:1.36
        name: time-updater
        command:
        - /bin/sh
        - -c
        - |
          while true; do  
            PID=$(pgrep -o nginx)
            if [ -n "$PID" ]; then
              echo "<h1>hello in MLOPS MENA COMMUNITY : $(date '+%Y-%m-%d %H:%M:%S')</h1>" \
                > /proc/$PID/root/usr/share/nginx/html/index.html
            fi
            sleep 5
          done
        
        securityContext:
          capabilities:
            add:
            - SYS_PTRACE

        resources: {}
status: {}
